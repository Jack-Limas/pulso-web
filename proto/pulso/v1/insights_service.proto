syntax = "proto3";

package pulso.v1;

message CategoryTotal {
  string category_code = 1;
  int64 total_cents = 2;
}

message Anomaly {
  string transaction_id = 1;
  string description = 2;
  int64 amount_cents = 3;
  string reason = 4;
}

message RecurringExpense {
  string merchant = 1;
  int64 average_cents = 2;
  int32 interval_days = 3;
  int32 occurrences = 4;
}

message AntExpense {
  string merchant = 1;
  string category_code = 2;
  int32 count = 3;
  int64 total_cents = 4;
  int64 average_cents = 5;
  string period_start = 6;
  string period_end = 7;
}

message LiquidityForecast {
  int64 current_cents = 1;
  int64 expected_income_cents = 2;
  int64 expected_expense_cents = 3;
  int64 projected_cents = 4;
  // Daily balance change in cents; negative means the balance is falling.
  int64 daily_trend_cents = 5;
}

message Recommendation {
  string title = 1;
  string detail = 2;
}

message GetDashboardRequest {
  optional string bank_account_id = 1;
  optional string statement_id = 2;
}

message GetDashboardResponse {
  int64 balance_cents = 1;
  int64 income_cents = 2;
  int64 expense_cents = 3;
  repeated CategoryTotal category_totals = 4;
  repeated Anomaly anomalies = 5;
  repeated RecurringExpense recurring_expenses = 6;
  repeated AntExpense ant_expenses = 7;
  LiquidityForecast forecast = 8;
  repeated Recommendation recommendations = 9;
}

enum AlertKind {
  ALERT_KIND_UNSPECIFIED = 0;
  ALERT_KIND_ANOMALY = 1;
  ALERT_KIND_ANT_EXPENSE = 2;
  ALERT_KIND_LOW_LIQUIDITY = 3;
  ALERT_KIND_FAILED_STATEMENT = 4;
}

enum AlertSeverity {
  ALERT_SEVERITY_UNSPECIFIED = 0;
  ALERT_SEVERITY_LOW = 1;
  ALERT_SEVERITY_MEDIUM = 2;
  ALERT_SEVERITY_HIGH = 3;
}

message Alert {
  // Stable across requests, so clients can remember which alerts were already seen.
  string id = 1;
  AlertKind kind = 2;
  AlertSeverity severity = 3;
  // What the alert is about: a transaction, a merchant or a file.
  string subject = 4;
  // The engine's explanation, already in the user's language, when there is one.
  string reason = 5;
  int64 amount_cents = 6;
  int32 count = 7;
  string statement_id = 8;
  string period_start = 9;
  string occurred_on = 10;
}

message ListAlertsRequest {}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

service InsightsService {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
}
